<div class="container my-2">
  <div class="row">
    @for (category of categories; track category.id) {
      <div class="col-12 col-sm-6 col-md-3 mb-3">
        <div class="card h100 shadow-sm border-start"
             [class.border-primary]="category.active">
          <div class="card-body d-flex flex-column justify-content-between">
            <h5 class="card-title text-capitalize">
              <span class="text-muted fs-6">#{{ $index }}</span> {{ category.name }}
            </h5>
            <p class="card-text">Explora los productos de esta sección.</p>
            <div class="d-flex justify-content-between align-items-center">
              @if (category.active) {
                <span class="badge bg-primary">Activa</span>
              } @else {
                <span class="badge bg-secondary-subtle">Inactive</span>
              }
              @if ($last) {
                <span class="badge bg-danger">¡Última!</span>
              }
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-light text-center py-5 border">
          <h4 class="text-secondary">No se han encontrado categorías.</h4>
        </div>
      </div>

    }
  </div>
</div>
