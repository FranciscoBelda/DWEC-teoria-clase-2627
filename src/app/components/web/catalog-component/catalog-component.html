<section class="container my-4">
  <header class="row mb-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
      <h2 class="text-dark mb-0">Catálogo de productos</h2>
      <span class="badge bg-secondary py-2 px-3">
        Mostrando: {{products.length}} artículos
      </span>
    </div>
  </header>
  <div class="row row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    @for (item of products; track item.id){
      <div class="col">
        <app-product-card-component [product]="item"/>
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-warning text-center" role="alert">
          Actualmente no hay productos en stock
        </div>
      </div>
    }
  </div>
</section>
