<div class="card p-4 shadow-sm border-0 bg-light">
  <h4>Perfil del Comprador</h4>
  <p><strong>Nombre: </strong>{{user().name}}</p>
  <p><strong>Ciudad: </strong>{{user().city}}</p>
  <p><strong>Tipo de cuenta: </strong>
    <span class="badge" [class.bg-success]="user().isPremium"
                        [class.bg-secondary]="!user().isPremium"
    >{{user().isPremium ? 'Socio Premium' : 'Usuario normal'}}</span>
  </p>
</div>

<div class="d-flex gap-2 mt-3">
  <button class="btn btn-outline-primary btn-sm"
          (click)="changeCity()">Cambiar de ciudad</button>
  <button class="btn btn-outline-success btn-sm"
          (click)="changePremium()">Alternar estado de cuenta</button>
</div>
